<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Café des Deux Moulins | Montmartre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bistro-red: #8B0000;
            --warm-gold: #D4AF37;
            --cream: #FFFDD0;
            --dark-wood: #2C1A1D;
            --text-dark: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--cream);
            color: var(--text-dark);
            line-height: 1.6;
        }

        header {
            background-color: var(--bistro-red);
            color: var(--cream);
            text-align: center;
            padding: 3rem 1rem;
            border-bottom: 5px solid var(--warm-gold);
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-style: italic;
            font-size: 1.2rem;
            color: var(--warm-gold);
        }

        nav {
            background-color: var(--dark-wood);
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
        }

        nav a {
            color: var(--cream);
            text-decoration: none;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--warm-gold);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .intro {
            text-align: center;
            margin-bottom: 4rem;
        }

        .intro h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--bistro-red);
            margin-bottom: 1rem;
        }

        .intro p {
            font-size: 1.1rem;
            color: #4a4a4a;
        }

        .menu-section {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        .menu-section h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--bistro-red);
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--warm-gold);
            padding-bottom: 0.5rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px dashed #ddd;
            padding-bottom: 0.5rem;
        }

        .item-name {
            font-weight: 500;
        }

        .item-desc {
            font-size: 0.85rem;
            color: #666;
            display: block;
            margin-top: 0.2rem;
        }

        .item-price {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--bistro-red);
            margin-left: 1rem;
        }

        footer {
            background-color: var(--dark-wood);
            color: var(--cream);
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 4rem;
            font-size: 0.9rem;
        }

        footer p {
            margin-bottom: 0.5rem;
        }
